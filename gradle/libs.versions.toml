[versions]
kotlin = "2.4.21"
kreate = "5.5.2"
kore = "2.5.0"
knot = "1.2.0"
compose = "1.12.2"
skiko = "0.150.2"
coroutines = "1.11.0"
serialization = "1.13.0"
datetime = "0.8.0"
kotlinpoet = "2.4.0"
lucide = "1.71.0"
jbr-api = "1.9.0"
kotest = "6.2.7"
# Floors for the classpaths of build tools, raised past known vulnerabilities.
tooling-jackson = "2.23.0"
tooling-bouncycastle = "1.87"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
compose-gradle-plugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose" }
kreate-gradle-plugin = { module = "com.davils.kreate:com.davils.kreate.gradle.plugin", version.ref = "kreate" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kore-core = { module = "com.davils:kore-core", version.ref = "kore" }
knot-platform = { module = "com.davils:knot-platform", version.ref = "knot" }
kore-testing = { module = "com.davils:kore-testing", version.ref = "kore" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "compose" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
skiko-runtime-linux-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-linux-x64", version.ref = "skiko" }
skiko-runtime-linux-arm64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-linux-arm64", version.ref = "skiko" }
skiko-runtime-macos-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-macos-x64", version.ref = "skiko" }
skiko-runtime-macos-arm64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-macos-arm64", version.ref = "skiko" }
skiko-runtime-windows-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-windows-x64", version.ref = "skiko" }
skiko-runtime-windows-arm64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-windows-arm64", version.ref = "skiko" }
jbr-api = { module = "org.jetbrains.runtime:jbr-api", version.ref = "jbr-api" }
lucide-icons = { module = "lucide-icons:lucide-icons", version.ref = "lucide" }

[bundles]
build-logic = [
    "kotlin-gradle-plugin",
    "compose-compiler-gradle-plugin",
    "compose-gradle-plugin",
    "kreate-gradle-plugin",
    "kotlinpoet",
    "kotlinx-serialization-json",
]
build-logic-testing = [
    "kotest-runner-junit5",
    "kotest-assertions-core",
]
compose = [
    "compose-runtime",
    "compose-ui",
    "compose-foundation",
    "compose-animation",
]
compose-testing = [
    "compose-ui-test",
    "kotlinx-coroutines-test",
    "skiko-runtime-linux-x64",
    "skiko-runtime-linux-arm64",
    "skiko-runtime-macos-x64",
    "skiko-runtime-macos-arm64",
    "skiko-runtime-windows-x64",
    "skiko-runtime-windows-arm64",
]
gallery-desktop = [
    "kotlinx-coroutines-swing",
    "skiko-runtime-linux-x64",
    "skiko-runtime-linux-arm64",
    "skiko-runtime-macos-x64",
    "skiko-runtime-macos-arm64",
    "skiko-runtime-windows-x64",
    "skiko-runtime-windows-arm64",
]
